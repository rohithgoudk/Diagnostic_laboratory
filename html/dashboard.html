<script>
  /* Scroll position rules for this page:
     · refresh                    → start at the top
     · normal link to this page   → top (or the #section in the link)
     · Back / "Go back" to here   → return to the exact spot you left */
  (function () {
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    var KEY = 'scrollPos:' + location.pathname;
    var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
    var type = nav.type || (performance.navigation && ['navigate', 'reload', 'back_forward'][performance.navigation.type]) || 'navigate';
    var saved = null;
    if (type === 'back_forward') { try { saved = JSON.parse(sessionStorage.getItem(KEY)); } catch (e) {} }
    var target = (location.hash && type === 'navigate') ? location.hash : '';
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    function save() { try { sessionStorage.setItem(KEY, JSON.stringify({ y: Math.round(window.scrollY) })); sessionStorage.setItem('lastPage', location.pathname); } catch (e) {} }
    var userMoved = false;
    function land() {
      if (userMoved) return;
      if (saved && typeof saved.y === 'number') { window.scrollTo(0, saved.y); return; }
      var el = target && document.querySelector(target);
      if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 70); else window.scrollTo(0, 0);
    }
    if (!saved) window.scrollTo(0, 0);
    // remember where you were whenever you leave the page
    window.addEventListener('pagehide', save);
    document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('a[href], button')) save(); }, true);
    // stop re-positioning as soon as you start scrolling yourself
    ['wheel', 'touchstart', 'keydown'].forEach(function (ev) { window.addEventListener(ev, function () { userMoved = true; }, { passive: true, once: true }); });
    window.addEventListener('load', function () { land(); setTimeout(land, 80); setTimeout(land, 450); setTimeout(land, 1300); });
  })();
</script>

  };

  /* =========================================================
     SIGNED-IN USER (from login page → localStorage "user")
     ========================================================= */
  const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
  const USER_KEYS = ['user', 'currentUser', 'loggedInUser', 'authUser', 'userData', 'profile', 'account', 'session', 'userEmail', 'email'];
  let foundUserKey = null;

  function asEmail(v) { return typeof v === 'string' && EMAIL_RE.test(v.trim()) ? v.trim() : null; }
  function findEmailIn(obj, depth) {
    if (!obj || depth > 4) return null;
    if (typeof obj === 'string') {
      const e = asEmail(obj); if (e) return { email: e };
      try { return findEmailIn(JSON.parse(obj), depth + 1); } catch (err) { return null; }
    }
    if (typeof obj !== 'object') return null;
    for (const k in obj) { const e = asEmail(obj[k]); if (e) return Object.assign({}, obj, { email: e }); }
    for (const k in obj) { const hit = findEmailIn(obj[k], depth + 1); if (hit) return Object.assign({}, obj, hit); }
    return null;
  }
  function getCurrentUser() {
    const stores = [];
    try { stores.push(localStorage); } catch (e) {}
    try { stores.push(sessionStorage); } catch (e) {}
    for (const s of stores) { try { if (s.getItem('isAuthenticated') === 'false') return null; } catch (e) {} }
    for (const s of stores) {
      for (const key of USER_KEYS) {
        let hit = null;
        try { hit = findEmailIn(s.getItem(key), 0); } catch (e) {}
        if (hit) { foundUserKey = key; return hit; }
      }
    }
    return null;
  }

  const currentUser = getCurrentUser();
  const currentEmail = currentUser ? currentUser.email : '';
  const storedName = currentUser && typeof currentUser.name === 'string' ? currentUser.name : '';
  const currentUsername = storedName || (currentEmail ? currentEmail.split('@')[0] : '');
  const currentInitial = ((currentUsername || currentEmail || '?').charAt(0) || '?').toUpperCase();
  const currentRole = currentUser ? (currentUser.role === 'admin' ? 'Lab administrator' : 'Patient') : 'Not signed in';

  function paintUserChrome() {
    const name = currentUsername || 'Signed out';
    const email = currentEmail || '—';
    document.querySelectorAll('#sidebar-user-avatar, #topbar-user-avatar').forEach(el => el.textContent = currentInitial);
    const sName = document.getElementById('sidebar-user-name');
    sName.textContent = name; sName.title = name;
    const sEmail = document.getElementById('sidebar-user-email');
    sEmail.textContent = email; sEmail.title = email;
    document.getElementById('topbar-user-name').textContent = name;
    document.getElementById('topbar-user-email').textContent = email;
    document.getElementById('topbar-user-role').textContent = currentRole;
  }

  function logout() {
    const keys = ['user', 'isAuthenticated', 'activeNav', 'settings'].concat(USER_KEYS);
    if (foundUserKey && keys.indexOf(foundUserKey) === -1) keys.push(foundUserKey);
    keys.forEach(k => {
      try { localStorage.removeItem(k); } catch (e) {}
      try { sessionStorage.removeItem(k); } catch (e) {}
    });
    window.location.href = 'login.html';
  }

  /* =========================================================
     STATE
     ========================================================= */
  function readStore(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function writeStore(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function loadSettings() {
    const d = { smsReady: true, emailPdf: true, shareDoctor: false, fastingReminders: true, units: 'Conventional (mg/dL)', language: 'English' };
    try { const raw = readStore('settings'); if (raw) return Object.assign(d, JSON.parse(raw)); } catch (e) {}
    return d;
  }
  function saveSettings() { writeStore('settings', JSON.stringify(state.settings)); }

  const saved = readStore('activeNav');
  let state = {
    activeNav: saved && pageMap[saved] ? saved : 'dashboard',
    reportCat: 'All',
    testCat: 'All',
    testSearch: '',
    marker: 'HbA1c',
    settings: loadSettings()
  };

  function go404() { window.location.href = '404.html'; }
  function fmt(n) { return n.toLocaleString('en-IN'); }
  function rupees(n) { return '₹' + fmt(n); }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  /* =========================================================
     SHARED PIECES
     ========================================================= */
  function kpiRow(items) {
    return `<section class="kpis">${items.map((k, i) => `
      <article class="kpi anim" style="--c:${k.color || '#0d9488'}" onclick="${k.nav ? '' : 'go404()'}" ${k.nav ? `data-nav="${k.nav}"` : ''}>
        <div class="kpi-top">
          <span class="kpi-ico">${ico(k.icon || 'pulse')}</span>
          ${k.trend ? `<span class="kpi-trend ${k.trend.good === false ? 'trend-bad' : 'trend-good'}">${k.trend.text}</span>` : ''}
        </div>
        <span class="kpi-value" ${k.count === false ? '' : 'data-count'}>${k.value}</span>
        <span class="kpi-label">${k.label}</span>
        ${k.bar !== undefined ? `<span class="kpi-track"><span class="kpi-fill" data-w="${k.bar}"></span></span>` : ''}
        ${k.note ? `<span class="kpi-note">${k.note}</span>` : ''}
      </article>`).join('')}</section>`;
  }
  function card(o, body) {
    return `<section class="card anim ${o.cls || ''}">
      <header class="card-head">
        <div><h2>${ico(o.icon || 'grid', 'head-ico')}${o.title}</h2>${o.sub ? `<p>${o.sub}</p>` : ''}</div>
        ${o.aside || ''}
      </header>
      ${body}
    </section>`;
  }
  function chips(list, current, cls) {
    return `<div class="chip-row">${list.map(c => `<button class="chip ${cls} ${current === c ? 'chip-on' : ''}" data-filter="${c}">${c}</button>`).join('')}</div>`;
  }

  /* reference-range bar: green band = normal range, marker = your value */
  function rangeBar(r) {
    const pct = v => Math.max(0, Math.min(100, (v - r.min) / (r.max - r.min) * 100));
    const out = r.v < r.lo || r.v > r.hi;
    return `<span class="rbar" data-tip="${r.name}: ${r.v} ${r.unit} · normal ${r.lo}–${r.hi}" tabindex="0">
      <span class="rbar-band" style="left:${pct(r.lo)}%;width:${pct(r.hi) - pct(r.lo)}%"></span>
      <i class="rbar-mark ${out ? 'is-out' : ''}" data-left="${pct(r.v).toFixed(1)}" style="left:${pct(r.v).toFixed(1)}%"></i>
    </span>`;
  }
  function resultRow(r, i) {
    const out = r.v < r.lo || r.v > r.hi;
    const label = out ? (r.v > r.hi ? 'High' : 'Low') : 'Normal';
    return `<li class="res row-anim">
      <span class="res-name">${r.name}</span>
      <span class="res-val"><b>${r.v}</b> ${r.unit}</span>
      ${rangeBar(r)}
      <span class="flag ${out ? 'flag-out' : 'flag-ok'}">${label}</span>
    </li>`;
  }

  /* stepper for a sample's journey through the lab */
  function stepper(s) {
    return `<ol class="stepper" style="--done:${(s.stage / (SAMPLE_STEPS.length - 1) * 100).toFixed(1)}">
      <span class="stepper-track"><span class="stepper-fill" data-w="${(s.stage / (SAMPLE_STEPS.length - 1) * 100).toFixed(1)}"></span></span>
      ${SAMPLE_STEPS.map((label, i) => `<li class="st ${i < s.stage ? 'st-done' : i === s.stage ? (s.stage === 4 ? 'st-done' : 'st-live') : ''}">
        <span class="st-dot">${i < s.stage || s.stage === 4 ? ico('check', 'st-ico') : ''}</span>
        <b>${label}</b><em>${s.times[i] || '—'}</em>
      </li>`).join('')}
    </ol>`;
  }

  /* line chart for one marker with its normal range shaded */
  function trendChart(key, compact) {
    const m = markers[key], W = 600, H = 220;
    const lo = Math.min(...m.data, m.lo), hi = Math.max(...m.data, m.hi);
    const pad = (hi - lo) * .15 || 1;
    const ymin = Math.max(0, lo - pad), ymax = hi + pad;
    const yp = v => (v - ymin) / (ymax - ymin);
    const x = i => i / (m.data.length - 1) * W;
    const pts = m.data.map((v, i) => `${x(i).toFixed(1)},${(H - yp(v) * H).toFixed(1)}`).join(' ');
    const ticks = [0, 1, 2, 3].map(t => ymin + (ymax - ymin) * t / 3);
    const grid = ticks.map(v => `<span class="tc-grid" style="bottom:${(yp(v) * 100).toFixed(2)}%"><em>${v.toFixed(m.dec)}</em></span>`).join('');
    const bandBottom = yp(Math.max(m.lo, ymin)) * 100, bandTop = yp(Math.min(m.hi, ymax)) * 100;
    const pos = i => (i / (m.data.length - 1) * 100).toFixed(2);
    const dots = m.data.map((v, i) => {
      const out = v < m.lo || v > m.hi;
      return `<div class="tc-col" style="left:${pos(i)}%" tabindex="0" data-tip="${trendMonths[i]} 2026 · ${v} ${m.unit}${out ? ' · outside normal range' : ''}">
        <span class="tc-dot ${out ? 'is-out' : ''}" style="bottom:${(yp(v) * 100).toFixed(2)}%;--c:${m.color}"></span></div>`;
    }).join('');
    return `<div class="tc-legend">
        <span><i style="background:${m.color}"></i>${key} (${m.unit})</span>
        <span><i class="band"></i>Normal range ${m.lo}–${m.hi}</span>
      </div>
      <div class="tc ${compact ? 'tc-compact' : ''}" role="img" aria-label="${key} over the last ${m.data.length} months">
        <div class="tc-plot">
          ${grid}
          <span class="tc-band" style="bottom:${bandBottom.toFixed(2)}%;height:${(bandTop - bandBottom).toFixed(2)}%"></span>
          <svg class="tc-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
            <defs><linearGradient id="tcFill-${key.replace(/\W/g, '')}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${m.color}" stop-opacity=".22"/><stop offset="1" stop-color="${m.color}" stop-opacity="0"/>
            </linearGradient></defs>
            <polygon class="tc-area" points="0,${H} ${pts} ${W},${H}" fill="url(#tcFill-${key.replace(/\W/g, '')})"/>
            <polyline class="tc-line" points="${pts}" stroke="${m.color}"/>
          </svg>
          <div class="tc-cols">${dots}</div>
        </div>
        <div class="tc-x">${trendMonths.map((mo, i) => `<span style="left:${pos(i)}%">${mo}</span>`).join('')}</div>
      </div>`;
  }

  /* =========================================================
     HEALTH TRENDS
     ========================================================= */
  function renderTrends() {
    const m = markers[state.marker];
    const first = m.data[0], last = m.data[m.data.length - 1];
    const change = last - first;
    const inRange = m.data.filter(v => v >= m.lo && v <= m.hi).length;
    const towardRange = (last > m.hi && change < 0) || (last < m.lo && change > 0) || (last >= m.lo && last <= m.hi);
    const kpis = kpiRow([
      { label: 'Latest value', value: `${last.toFixed(m.dec)} ${m.unit}`, icon: 'pulse', color: m.color },
      { label: `Change since ${trendMonths[0]}`, value: `${change > 0 ? '+' : ''}${change.toFixed(m.dec)}`, count: false, icon: 'trend', color: towardRange ? '#10b981' : '#e11d48', trend: { text: towardRange ? 'Improving' : 'Watch', good: towardRange } },
      { label: 'Readings in range', value: `${inRange}/${m.data.length}`, count: false, icon: 'check', color: '#0d9488', bar: inRange / m.data.length * 100 },
      { label: 'Normal range', value: `${m.lo}–${m.hi}`, count: false, icon: 'shield', color: '#8b5cf6', note: m.unit }
    ]);
    const table = `<div class="table-wrap"><table class="table">
      <thead><tr><th>Month</th><th>Value</th><th>Status</th></tr></thead>
      <tbody>${m.data.map((v, i) => {
        const out = v < m.lo || v > m.hi;
        return `<tr class="row-anim"><td data-label="Month">${trendMonths[i]} 2026</td><td class="mono" data-label="Value">${v} ${m.unit}</td>
          <td data-label="Status"><span class="flag ${out ? 'flag-out' : 'flag-ok'}">${out ? (v > m.hi ? 'High' : 'Low') : 'Normal'}</span></td></tr>`;
      }).reverse().join('')}</tbody></table></div>`;
    return `${kpis}
      ${card({ title: state.marker, sub: 'Last 8 months · hover a point for the exact value', icon: 'trend', aside: chips(Object.keys(markers), state.marker, 'marker-filter') }, trendChart(state.marker))}
      <div class="grid grid-b">
        ${card({ title: 'All readings', sub: 'Newest first', icon: 'doc', cls: 'card-table' }, table)}
        ${card({ title: 'About this marker', sub: 'In plain words', icon: 'info' }, `<p class="about">${m.about}</p><button class="chip" onclick="go404()">${ico('share', 'chip-ico')}Share trend with my doctor</button>`)}
      </div>`;
  }

      </article>`;
    }).join('');
    return `${kpis}${card({ title: 'Tests & packages', sub: terms.length || state.testCat !== 'All' ? `Showing ${list.length} of ${tests.length}` : 'Prices include sample collection', icon: 'cart',
        aside: `<label class="finder finder-inline">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="test-search-input" placeholder="Search tests, e.g. thyroid" aria-label="Search tests" value="${esc(state.testSearch)}">
        </label>` },
      `${chips(testCats, state.testCat, 'test-filter')}<div class="test-grid">${cards || '<p class="empty">No tests match that search.</p>'}</div>`)}`;
  }

  /* =========================================================
     BILLING
     ========================================================= */
  function renderBilling() {
    const paid = invoices.filter(i => i.status === 'Paid').reduce((a, i) => a + i.amount, 0);
    const due = invoices.filter(i => i.status === 'Due').reduce((a, i) => a + i.amount, 0);
    const kpis = kpiRow([
      { label: 'Paid this year', value: rupees(paid), icon: 'rupee' },
      { label: 'Amount due', value: rupees(due), icon: 'clock', color: '#d97706', note: 'INV-3370 · Vitamin D & B12' },
      { label: 'Invoices', value: String(invoices.length), icon: 'receipt', color: '#2563eb' },
      { label: 'Saved with offers', value: rupees(3651), icon: 'check', color: '#10b981', note: 'vs listed prices' }
    ]);
    const rows = invoices.map(i => `
      <tr class="row-anim" onclick="go404()">
        <td class="mono" data-label="Invoice">${i.id}</td>
        <td class="stack" data-label="Tests"><span class="t-name">${i.desc}</span></td>
        <td data-label="Date">${i.date}</td>
        <td class="num" data-label="Amount">${rupees(i.amount)}</td>
        <td data-label="Paid by">${i.method}</td>
        <td data-label="Status"><span class="state state-${invStatus[i.status]}">${i.status}</span></td>
        <td data-label=""><button class="chip ${i.status === 'Due' ? 'chip-solid' : ''}" onclick="event.stopPropagation();go404()">${i.status === 'Due' ? 'Pay now' : 'Receipt'}</button></td>
      </tr>`).join('');
    return `${kpis}${card({ title: 'Invoices', sub: 'Newest first', icon: 'receipt', cls: 'card-table' },
      `<div class="table-wrap"><table class="table">
        <thead><tr><th>Invoice</th><th>Tests</th><th>Date</th><th>Amount</th><th>Paid by</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`)}`;
  }

  /* =========================================================
     NOTIFICATIONS
     ========================================================= */
  function renderAlerts() {
    const kpis = kpiRow([
      { label: 'Notifications', value: String(notes.length), icon: 'bell' },
      { label: 'To discuss with doctor', value: String(notes.filter(n => n.level === 'attention').length), icon: 'alert', color: '#e11d48' },
      { label: 'Reminders', value: String(notes.filter(n => n.level === 'reminder').length), icon: 'clock', color: '#d97706' },
      { label: 'Updates', value: String(notes.filter(n => n.level === 'update').length), icon: 'info', color: '#2563eb' }
    ]);
    return `${kpis}${card({ title: 'All notifications', sub: 'Results to discuss first, then reminders and updates', icon: 'bell' }, `<ul class="note-list">${notes.map(noteRow).join('')}</ul>`)}`;
  }

  /* =========================================================
     SETTINGS
     ========================================================= */
  function switchHtml(id, value) {
    return `<span class="switch ${value ? 'on' : ''}" data-toggle="${id}" role="switch" aria-checked="${value}" tabindex="0"><span class="switch-knob"></span></span>`;
  }
  function selectHtml(id, options, value) {
    return `<select class="pref-select" id="${id}">${options.map(o => `<option ${value === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  }
  function deviceName() {
    const ua = navigator.userAgent;
    const browser = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
    const os = /Android/.test(ua) ? 'Android' : /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : 'this device';
    return browser + ' on ' + os;
  }
  function renderSettings() {
    const s = state.settings;
    const displayName = currentUsername || 'Signed out';
    const displayEmail = currentEmail || 'No account signed in';
    return `<div class="grid grid-settings">
      ${card({ title: 'Account', sub: 'The profile signed in on this device', icon: 'users' },
        `<div class="account">
          <span class="avatar lg">${currentInitial}</span>
          <div>
            <span class="account-name">${esc(displayName)}</span>
            <span class="account-email">${esc(displayEmail)}</span>
            <span class="account-role">${currentRole} · ID PT-10482</span>
          </div>
        </div>
        <div class="chip-row"><button class="chip" onclick="go404()">Edit profile</button><button class="chip" onclick="go404()">Family members</button></div>`)}

      ${card({ title: 'Preferences', sub: 'Report delivery and reminders', icon: 'gear' },
        `<div class="pref"><div><span class="pref-title">SMS when a report is ready</span><span class="pref-desc">A text with a secure link to your report</span></div>${switchHtml('smsReady', s.smsReady)}</div>
        <div class="pref"><div><span class="pref-title">Email PDF reports</span><span class="pref-desc">Signed PDF sent to your inbox</span></div>${switchHtml('emailPdf', s.emailPdf)}</div>
        <div class="pref"><div><span class="pref-title">Share reports with my doctor</span><span class="pref-desc">Dr. Meera Iyer gets a copy automatically</span></div>${switchHtml('shareDoctor', s.shareDoctor)}</div>
        <div class="pref"><div><span class="pref-title">Fasting reminders</span><span class="pref-desc">The evening before a fasting test</span></div>${switchHtml('fastingReminders', s.fastingReminders)}</div>
        <div class="pref"><div><span class="pref-title">Result units</span><span class="pref-desc">How glucose and cholesterol are shown</span></div>${selectHtml('units-select', ['Conventional (mg/dL)', 'SI (mmol/L)'], s.units)}</div>
        <div class="pref pref-last"><div><span class="pref-title">Language</span><span class="pref-desc">Interface display language</span></div>${selectHtml('lang-select', ['English', 'Tamil', 'Telugu', 'Hindi'], s.language)}</div>`)}

      ${card({ title: 'Session', sub: 'Sign out of this account on this device', icon: 'clock' },
        `<div class="session"><p>Signed in as <strong>${esc(displayEmail)}</strong>. Signing out clears the session and returns you to the sign-in screen.</p>
        <ul class="session-meta">
          <li><span class="lbl">This device</span><b>${esc(deviceName())}</b></li>
          <li><span class="lbl">Status</span><b class="session-live"><span class="live-dot"></span>Active now</b></li>
        </ul>
        <button class="chip chip-danger" id="settings-logout-btn">Sign out</button></div>`)}

      ${card({ title: 'Privacy & data', sub: 'These cannot be undone', icon: 'shield' },
        `<div class="danger-row"><button class="chip" onclick="go404()">Download my data</button><button class="chip chip-danger" onclick="go404()">Reset password</button><button class="chip chip-danger" onclick="go404()">Delete account</button></div>`)}
    </div>`;
  }

  const pageRenderers = {
    dashboard: renderDashboard, reports: renderReports, samples: renderSamples, trends: renderTrends,
    book: renderBook, billing: renderBilling, alerts: renderAlerts, settings: renderSettings
  };

  /* =========================================================
     MOTION (GSAP) — everything is visible without it
     ========================================================= */
  function setBarsNow() {
    document.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w + '%');
  }
  function countUp(el) {
    const raw = el.textContent.trim();
    const m = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
    if (!m) return;
    const prefix = m[1], numStr = m[2].replace(/,/g, ''), suffix = m[3];
    const target = parseFloat(numStr);
    const decimals = numStr.includes('.') ? numStr.split('.')[1].length : 0;
    const o = { v: 0 };
    gsap.to(o, { v: target, duration: 1.1, ease: 'power2.out',
      onUpdate: () => { el.textContent = prefix + (decimals ? o.v.toFixed(decimals) : fmt(Math.round(o.v))) + suffix; },
      onComplete: () => { el.textContent = raw; } });
  }
  function animateRows() {
    if (!ANIM) return;
    gsap.from('#content-area .row-anim', { y: 12, opacity: 0, duration: .45, stagger: .035, ease: 'power2.out', clearProps: 'transform,opacity' });
  }
  function animatePage() {
    setBarsNow();
    if (!ANIM) return;
    const area = '#content-area';
    gsap.from('#page-head > *', { y: 14, opacity: 0, duration: .5, stagger: .07, ease: 'power3.out', clearProps: 'transform,opacity' });
    gsap.from(`${area} .anim`, { y: 26, opacity: 0, duration: .65, stagger: .07, ease: 'power3.out', clearProps: 'transform,opacity' });
    gsap.from(`${area} .row-anim`, { x: -12, opacity: 0, duration: .45, stagger: .03, delay: .25, ease: 'power2.out', clearProps: 'transform,opacity' });
    gsap.fromTo(`${area} [data-w]`, { width: 0 }, { width: (i, el) => el.dataset.w + '%', duration: 1.1, delay: .3, ease: 'power3.out', stagger: .04 });
    document.querySelectorAll(`${area} .rbar-mark`).forEach((el, i) => {
      gsap.fromTo(el, { left: '0%' }, { left: el.dataset.left + '%', duration: 1.1, delay: .35 + i * .05, ease: 'expo.out' });
    });
    document.querySelectorAll(`${area} .tc-line`).forEach(line => {
      const len = line.getTotalLength ? line.getTotalLength() : 1200;
      gsap.fromTo(line, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.4, delay: .3, ease: 'power2.out', clearProps: 'strokeDasharray,strokeDashoffset' });
    });
    gsap.from(`${area} .tc-area`, { opacity: 0, duration: .8, delay: 1 });
    gsap.from(`${area} .tc-dot`, { scale: 0, duration: .4, stagger: .06, delay: .6, ease: 'back.out(3)', clearProps: 'transform' });
    gsap.from(`${area} .tc-band`, { scaleY: 0, transformOrigin: '50% 100%', duration: .8, delay: .2, ease: 'power2.out', clearProps: 'transform' });
    document.querySelectorAll(`${area} [data-count]`).forEach(countUp);
    const tube = document.querySelector(`${area} .ht-liquid`);
    if (tube) gsap.fromTo(tube, { height: '0%' }, { height: '62%', duration: 1.6, delay: .4, ease: 'power2.inOut' });
  }

  /* background: bands slowly migrate down their gel lanes */
  (function gel() {
    const box = document.getElementById('bgBands');
    const colors = ['rgba(13,148,136,.22)', 'rgba(37,99,235,.18)', 'rgba(139,92,246,.18)', 'rgba(13,148,136,.14)'];
    const lanes = Math.ceil(window.innerWidth / 64) + 1;
    let html = '';
    for (let l = 0; l < lanes; l++) {
      const n = 2 + (l % 3);
      for (let b = 0; b < n; b++) {
        html += `<i style="left:${l * 64 + 12}px;top:${(b * 31 + l * 17) % 100}%;width:40px;height:${4 + (b + l) % 5}px;background:${colors[(l + b) % colors.length]}"></i>`;
      }
    }
    box.innerHTML = html;
    if (!ANIM) return;
    box.querySelectorAll('i').forEach(band => {
      gsap.to(band, { y: '+=' + (60 + Math.random() * 120), opacity: .35, duration: 8 + Math.random() * 10, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: Math.random() * 4 });
    });
  })();

  /* =========================================================
     SHELL
     ========================================================= */
  function renderNav() {
    document.getElementById('nav-drawer').innerHTML = Object.keys(navGroups).map(g => `
      <p class="dock-label">${groupLabels[g]}</p>
      <nav class="dock-nav">${navGroups[g].map(i => {
        const n = i.badge ? i.badge() : 0;
        return `<button class="dock-item ${state.activeNav === i.id ? 'on' : ''}" data-nav="${i.id}" ${state.activeNav === i.id ? 'aria-current="page"' : ''}>${ico(i.icon, 'dock-ico')}<span class="dock-text">${i.label}</span>${n ? `<span class="nav-badge">${n}</span>` : ''}</button>`;
      }).join('')}</nav>`).join('');
  }

  function renderPage(animate) {
    const page = pageMap[state.activeNav];
    const group = Object.keys(navGroups).find(g => navGroups[g].some(i => i.id === state.activeNav));
    document.getElementById('page-title-text').textContent = page.title;
    document.getElementById('page-sub-text').textContent = page.sub;
    document.getElementById('page-kicker').textContent = groupLabels[group] || '';
    document.getElementById('page-actions').innerHTML = pageActions[state.activeNav] || '';
    document.title = page.title + ' – Diagnostic Laboratory';
    const content = document.getElementById('content-area');
    content.innerHTML = pageRenderers[state.activeNav]();
    renderNav();
    const sBtn = document.getElementById('settings-logout-btn');
    if (sBtn) sBtn.addEventListener('click', logout);
    if (animate !== false) {
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      animatePage();
    } else {
      setBarsNow();
    }
  }

  function navigateTo(id) {
    if (!pageMap[id]) return;
    state.activeNav = id;
    writeStore('activeNav', id);
    closeDrawer();
    closeWhoami();
    renderPage();
  }

  /* ---- sidebar: fixed on desktop, drawer at 1100px and below ---- */
  const MENU_BREAK = 1100;
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const burger = document.getElementById('hamburger-btn');

  function openDrawer() {
    sidebar.classList.add('open');
    scrim.classList.add('show');
    burger.classList.add('is-open');
    burger.setAttribute('aria-expanded', 'true');
    burger.setAttribute('aria-label', 'Close menu');
    sidebar.setAttribute('aria-hidden', 'false');
    document.body.classList.add('nav-open');
    if (ANIM) gsap.from('#nav-drawer .dock-item', { x: -16, opacity: 0, duration: .35, stagger: .03, delay: .1, clearProps: 'transform,opacity' });
  }
  function closeDrawer() {
    if (!sidebar.classList.contains('open')) return;
    sidebar.classList.remove('open');
    scrim.classList.remove('show');
    burger.classList.remove('is-open');
    burger.setAttribute('aria-expanded', 'false');
    burger.setAttribute('aria-label', 'Open menu');
    document.body.classList.remove('nav-open');
    syncDock();
  }
  function syncDock() {
    const fixed = window.innerWidth > MENU_BREAK;
    if (fixed) closeDrawer();
    sidebar.setAttribute('aria-hidden', fixed || sidebar.classList.contains('open') ? 'false' : 'true');
  }
  burger.addEventListener('click', () => sidebar.classList.contains('open') ? closeDrawer() : openDrawer());
  document.getElementById('dock-close').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);
  window.addEventListener('resize', syncDock);
  syncDock();

  /* ---- user menu ---- */
  const whoami = document.getElementById('topbar-user');
  const whoamiBtn = document.getElementById('topbar-user-btn');
  function closeWhoami() { whoami.classList.remove('open'); whoamiBtn.setAttribute('aria-expanded', 'false'); }
  whoamiBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = whoami.classList.toggle('open');
    whoamiBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', e => { if (!whoami.contains(e.target)) closeWhoami(); });

  document.getElementById('notif-btn').addEventListener('click', () => navigateTo('alerts'));
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('topbar-logout-btn').addEventListener('click', logout);

  /* ---- top bar search: on phones the magnifier opens the field first ---- */
  const finder = document.getElementById('topbar-search');
  const finderInput = document.getElementById('topbar-search-input');
  function openFinder() { finder.classList.add('expanded'); finderInput.focus(); }
  finder.addEventListener('submit', e => {
    e.preventDefault();
    if (window.innerWidth <= 720 && !finder.classList.contains('expanded')) { openFinder(); return; }
    const q = finderInput.value.trim();
    if (!q) { finderInput.focus(); return; }
    // a test name jumps straight into "Book a test" with the search filled in
    state.testSearch = q; state.testCat = 'All';
    finderInput.value = ''; finder.classList.remove('expanded'); finderInput.blur();
    navigateTo('book');
  });
  finderInput.addEventListener('blur', () => { if (!finderInput.value.trim()) finder.classList.remove('expanded'); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDrawer(); closeWhoami(); finderInput.blur(); }
    const typing = e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); openFinder(); }
  });

  /* ---- chart tooltip ---- */
  const tip = document.getElementById('chart-tip');
  function showTip(el) {
    tip.textContent = el.getAttribute('data-tip');
    tip.classList.add('show');
    const r = el.getBoundingClientRect();
    const w = tip.offsetWidth;
    let x = r.left + r.width / 2 - w / 2;
    x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
    tip.style.left = x + 'px';
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 10) + 'px';
  }
  function hideTip() { tip.classList.remove('show'); }
  document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
  document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('focusout', hideTip);
  window.addEventListener('scroll', hideTip, { passive: true });

  /* ---- delegated clicks ---- */
  document.addEventListener('click', e => {
    const navBtn = e.target.closest('[data-nav]');
    if (navBtn) { navigateTo(navBtn.getAttribute('data-nav')); return; }
    const rf = e.target.closest('.report-filter');
    if (rf) { state.reportCat = rf.dataset.filter; renderPage(false); animateRows(); return; }
    const tf = e.target.closest('.test-filter');
    if (tf) { state.testCat = tf.dataset.filter; renderPage(false); animateRows(); return; }
    const mf = e.target.closest('.marker-filter');
    if (mf) { state.marker = mf.dataset.filter; renderPage(false); animatePage(); return; }
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) { flipSwitch(toggle); return; }
  });
  document.addEventListener('keydown', e => {
    const toggle = e.target.closest && e.target.closest('[data-toggle]');
    if (toggle && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); flipSwitch(toggle); }
  });
  function flipSwitch(toggle) {
    const key = toggle.dataset.toggle;
    state.settings[key] = !state.settings[key];
    saveSettings();
    toggle.classList.toggle('on', state.settings[key]);
    toggle.setAttribute('aria-checked', String(state.settings[key]));
  }

  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'test-search-input') {
      state.testSearch = e.target.value;
      const caret = e.target.selectionStart;
      renderPage(false);
      const input = document.getElementById('test-search-input');
      if (input) { input.focus(); input.setSelectionRange(caret, caret); }
    }
  });
  document.addEventListener('change', e => {
    if (!e.target) return;
    if (e.target.id === 'lang-select')  { state.settings.language = e.target.value; saveSettings(); }
    if (e.target.id === 'units-select') { state.settings.units = e.target.value; saveSettings(); }
  });

  /* ---- boot ---- */
  paintUserChrome();
  renderPage();
  if (ANIM) {
    // the drawer's off-screen position is a CSS transform, so only animate the fixed desktop sidebar
    if (window.innerWidth > MENU_BREAK) gsap.from('.dock', { x: -30, opacity: 0, duration: .7, ease: 'power3.out', clearProps: 'transform,opacity' });
    gsap.from('.head', { y: -20, opacity: 0, duration: .6, ease: 'power3.out', clearProps: 'transform,opacity' });
  }
  </script>
</body>
</html>
