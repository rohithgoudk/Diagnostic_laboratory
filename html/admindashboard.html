<script>
  /* Scroll position rules for this page:
     · refresh                    → start at the top
     · normal link to this page   → top (or the #section in the link)
     · Back / "Go back" to here   → return to the exact spot you left */
  (function () {
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    var KEY = 'scrollPos:' + location.pathname;
    var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
    var type = nav.type || (performance.navigation && ['navigate', 'reload', 'back_forward'][performance.navigation.type]) || 'navigate';
    var saved = null;
    if (type === 'back_forward') { try { saved = JSON.parse(sessionStorage.getItem(KEY)); } catch (e) {} }
    var target = (location.hash && type === 'navigate') ? location.hash : '';
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    function save() { try { sessionStorage.setItem(KEY, JSON.stringify({ y: Math.round(window.scrollY) })); sessionStorage.setItem('lastPage', location.pathname); } catch (e) {} }
    var userMoved = false;
    function land() {
      if (userMoved) return;
      if (saved && typeof saved.y === 'number') { window.scrollTo(0, saved.y); return; }
      var el = target && document.querySelector(target);
      if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 70); else window.scrollTo(0, 0);
    }
    if (!saved) window.scrollTo(0, 0);
    // remember where you were whenever you leave the page
    window.addEventListener('pagehide', save);
    document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('a[href], button')) save(); }, true);
    // stop re-positioning as soon as you start scrolling yourself
    ['wheel', 'touchstart', 'keydown'].forEach(function (ev) { window.addEventListener(ev, function () { userMoved = true; }, { passive: true, once: true }); });
    window.addEventListener('load', function () { land(); setTimeout(land, 80); setTimeout(land, 450); setTimeout(land, 1300); });
  })();
</script>

  const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
  const USER_KEYS = ['user', 'currentUser', 'loggedInUser', 'authUser', 'userData', 'profile', 'account', 'session', 'userEmail', 'email'];
  let foundUserKey = null;

  function asEmail(v) { return typeof v === 'string' && EMAIL_RE.test(v.trim()) ? v.trim() : null; }
  function findEmailIn(obj, depth) {
    if (!obj || depth > 4) return null;
    if (typeof obj === 'string') {
      const e = asEmail(obj); if (e) return { email: e };
      try { return findEmailIn(JSON.parse(obj), depth + 1); } catch (err) { return null; }
    }
    if (typeof obj !== 'object') return null;
    for (const k in obj) { const e = asEmail(obj[k]); if (e) return Object.assign({}, obj, { email: e }); }
    for (const k in obj) { const hit = findEmailIn(obj[k], depth + 1); if (hit) return Object.assign({}, obj, hit); }
    return null;
  }
  function getCurrentUser() {
    const stores = [];
    try { stores.push(localStorage); } catch (e) {}
    try { stores.push(sessionStorage); } catch (e) {}
    for (const s of stores) { try { if (s.getItem('isAuthenticated') === 'false') return null; } catch (e) {} }
    for (const s of stores) {
      for (const key of USER_KEYS) {
        let hit = null;
        try { hit = findEmailIn(s.getItem(key), 0); } catch (e) {}
        if (hit) { foundUserKey = key; return hit; }
      }
    }
    return null;
  }

  /* =========================================================

     ========================================================= */
  function qcFlag(z) { const a = Math.abs(z); return a > 3 ? 'reject' : a > 2 ? 'warn' : 'ok'; }
  function ljChart(key) {
    const s = qcSets[key], n = s.runs.length;
    const zs = s.runs.map(v => (v - s.mean) / s.sd);
    const yp = z => (z + 4) / 8 * 100;                 // plot covers -4 SD … +4 SD
    const xp = i => (i / (n - 1) * 100);
    const pts = zs.map((z, i) => `${(xp(i) * 6).toFixed(1)},${(220 - yp(Math.max(-4, Math.min(4, z))) * 2.2).toFixed(1)}`).join(' ');
    const lines = [3, 2, 1, 0, -1, -2, -3].map(k => `<span class="lj-line lj-${Math.abs(k)}" style="bottom:${yp(k)}%"><em>${k === 0 ? 'Mean' : (k > 0 ? '+' : '−') + Math.abs(k) + ' SD'}</em></span>`).join('');
    const dots = zs.map((z, i) => {
      const f = qcFlag(z);
      return `<div class="lj-col" style="left:${xp(i).toFixed(2)}%" tabindex="0" data-tip="Run ${i + 1} · ${s.runs[i]} ${s.unit} · ${z >= 0 ? '+' : ''}${z.toFixed(1)} SD${f === 'reject' ? ' · rejected (1-3s)' : f === 'warn' ? ' · warning (1-2s)' : ''}">
        <span class="lj-dot lj-${f}" style="bottom:${yp(Math.max(-4, Math.min(4, z))).toFixed(2)}%"></span></div>`;
    }).join('');
    return `<div class="lj" role="img" aria-label="Levey-Jennings chart for ${key}">
        <div class="lj-plot">
          <span class="lj-zone"></span>
          ${lines}
          <svg class="lj-svg" viewBox="0 0 600 220" preserveAspectRatio="none"><polyline class="lj-path" points="${pts}"/></svg>
          <div class="lj-cols">${dots}</div>
        </div>
        <div class="lj-x"><span style="left:0%">Run 1</span><span style="left:50%">Run 10</span><span style="left:100%">Run 20</span></div>
      </div>`;
  }
  function renderQc() {
    const s = qcSets[state.qcSet];
    const zs = s.runs.map(v => (v - s.mean) / s.sd);
    const rejects = zs.filter(z => qcFlag(z) === 'reject').length;
    const warns = zs.filter(z => qcFlag(z) === 'warn').length;
    const mean = s.runs.reduce((a, b) => a + b, 0) / s.runs.length;
    const sd = Math.sqrt(s.runs.reduce((a, b) => a + (b - mean) ** 2, 0) / (s.runs.length - 1));
    const cv = sd / mean * 100;
    const kpis = kpiRow([
      { label: 'Runs this month', value: String(s.runs.length), icon: 'qc', note: `on ${s.analyser}` },
      { label: 'Observed CV',     value: cv.toFixed(1) + '%', icon: 'pulse', color: cv > 3 ? '#d97706' : '#10b981', note: 'lower is more precise' },
      { label: 'Warnings (1-2s)', value: String(warns), icon: 'alert', color: '#d97706' },
      { label: 'Rejected (1-3s)', value: String(rejects), icon: 'x', color: '#e11d48', note: rejects ? 'patient runs held until rerun' : 'none this month' }
    ]);
    const all = Object.keys(qcSets).map(k => {
      const q = qcSets[k], z = q.runs.map(v => (v - q.mean) / q.sd);
      const r = z.filter(v => qcFlag(v) === 'reject').length, w = z.filter(v => qcFlag(v) === 'warn').length;
      return `<li class="check-mini row-anim">
        <span class="check-ico ${r ? 'bad' : w ? 'warn' : 'ok'}">${ico(r ? 'x' : w ? 'alert' : 'check')}</span>
        <span class="check-mini-name">${k} <em>${q.analyser}</em></span>
        <span class="check-mini-metric">${r ? r + ' rejected' : w ? w + ' warning' + (w > 1 ? 's' : '') : 'All in control'}</span>
      </li>`;
    }).join('');
    return `${kpis}
      ${card({ kicker: 'Levey-Jennings', title: state.qcSet, sub: `Target ${s.mean} ${s.unit}, 1 SD = ${s.sd} ${s.unit} · amber beyond ±2 SD, red beyond ±3 SD`, icon: 'qc', aside: chips(Object.keys(qcSets), state.qcSet, 'qc-filter') }, ljChart(state.qcSet))}
      ${card({ kicker: 'Summary', title: 'All control materials', sub: 'This month, Westgard 1-2s and 1-3s rules', icon: 'shield' }, `<ul class="check-minis">${all}</ul>`)}`;
  }

  /* =========================================================
     MOTION (GSAP) — the page is complete without it
     ========================================================= */
  function countUp(el) {
    const raw = el.textContent.trim();
    const m = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
    if (!m) return;
    const prefix = m[1], numStr = m[2].replace(/,/g, ''), suffix = m[3];
    const target = parseFloat(numStr);
    const decimals = numStr.includes('.') ? numStr.split('.')[1].length : 0;
    const o = { v: 0 };
    gsap.to(o, { v: target, duration: 1.1, ease: 'power2.out',
      onUpdate: () => { el.textContent = prefix + (decimals ? o.v.toFixed(decimals) : fmt(Math.round(o.v))) + suffix; },
      onComplete: () => { el.textContent = raw; } });
  }
  function animateRows() {
    if (!ANIM) return;
    gsap.from('#content-area .row-anim', { y: 12, opacity: 0, duration: .4, stagger: .03, ease: 'power2.out', clearProps: 'transform,opacity' });
  }
  function animatePage() {
    if (!ANIM) return;
    const A = '#content-area';
    gsap.from('#page-head > *', { y: 14, opacity: 0, duration: .5, stagger: .07, ease: 'power3.out', clearProps: 'transform,opacity' });
    gsap.from(`${A} .anim`, { y: 26, opacity: 0, duration: .65, stagger: .07, ease: 'power3.out', clearProps: 'transform,opacity' });
    gsap.from(`${A} .row-anim`, { x: -12, opacity: 0, duration: .45, stagger: .03, delay: .25, ease: 'power2.out', clearProps: 'transform,opacity' });
    gsap.from(`${A} [data-w]`, { width: 0, duration: 1.1, delay: .3, stagger: .05, ease: 'power3.out' });
    gsap.from(`${A} [data-h]`, { height: 0, duration: .9, delay: .25, stagger: .04, ease: 'back.out(1.4)' });
    document.querySelectorAll(`${A} .ring-fg`).forEach((c, i) => {
      gsap.fromTo(c, { strokeDashoffset: c.dataset.full }, { strokeDashoffset: c.dataset.dash, duration: 1.3, delay: .3 + i * .06, ease: 'power3.out' });
    });
    document.querySelectorAll(`${A} .lj-path`).forEach(p => {
      const plot = p.closest('.lj-plot');
      // the line is stretched to the plot, so scale the dash to cover its on-screen length
      const k = plot ? Math.max(plot.clientWidth / 600, plot.clientHeight / 220, 1) * 1.1 : 1.5;
      const len = (p.getTotalLength ? p.getTotalLength() : 1500) * k;
      gsap.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.6, delay: .3, ease: 'power2.out', clearProps: 'strokeDasharray,strokeDashoffset' });
    });
    gsap.from(`${A} .lj-dot`, { scale: 0, duration: .35, stagger: .04, delay: .5, ease: 'back.out(3)', clearProps: 'transform' });
    gsap.from(`${A} .tat-target`, { scaleY: 0, duration: .5, delay: 1, stagger: .08, ease: 'back.out(3)', clearProps: 'transform' });
    document.querySelectorAll(`${A} [data-count]`).forEach(countUp);
  }

  /* background: bands slowly migrate down their gel lanes */
  (function gel() {
    const box = document.getElementById('bgBands');
    const colors = ['rgba(13,148,136,.22)', 'rgba(37,99,235,.18)', 'rgba(139,92,246,.18)', 'rgba(13,148,136,.14)'];
    const lanes = Math.ceil(window.innerWidth / 64) + 1;
    let html = '';
    for (let l = 0; l < lanes; l++) {
      const n = 2 + (l % 3);
      for (let b = 0; b < n; b++) {
        html += `<i style="left:${l * 64 + 12}px;top:${(b * 31 + l * 17) % 100}%;width:40px;height:${4 + (b + l) % 5}px;background:${colors[(l + b) % colors.length]}"></i>`;
      }
    }
    box.innerHTML = html;
    if (!ANIM) return;
    box.querySelectorAll('i').forEach(band => {
      gsap.to(band, { yPercent: 0, y: '+=' + (60 + Math.random() * 120), opacity: .35, duration: 8 + Math.random() * 10, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: Math.random() * 4 });
    });
  })();

    if (id === 'billing') { const n = clients.filter(c => c.state === 'Overdue').length; return n ? `<span class="nav-badge">${n}</span>` : ''; }
    return '';

  /* ---- report sign-off: release / send back ---- */
  function resolveSignoff(id, released) {
    const req = signoffs.find(r => r.id === id);
    if (!req) return;
    const row = document.querySelector('[data-req="' + id + '"]');
    function finish() {
      signoffs = signoffs.filter(r => r.id !== id);
      auditTrail.unshift({
        time: 'Just now', actor: 'Admin (You)',
        action: released ? 'Released report' : 'Sent report back for rerun',
        target: req.id + ' · ' + req.test, scope: req.patient
      });
      const box = document.getElementById('approvals-box');
      if (box) box.innerHTML = signoffHtml();
      document.querySelectorAll('#approval-count').forEach(c => c.textContent = signoffs.length);
      const trail = document.getElementById('overview-trail');
      if (trail) trail.innerHTML = trailHtml(auditTrail.slice(0, 5));
      renderNav();
      toast((released ? 'Released ' : 'Sent back for rerun: ') + req.id + ' · ' + req.test, released ? 'yes' : 'no');
    }
    if (row && ANIM) {
      row.classList.add(released ? 'is-yes' : 'is-no');
      gsap.to(row, { x: released ? 40 : -40, opacity: 0, height: 0, paddingTop: 0, paddingBottom: 0, marginTop: 0, duration: .45, ease: 'power2.in', onComplete: finish });
    } else {
      finish();
    }
  }

  /* ---- sidebar: fixed on desktop, drawer at 1100px and below ---- */
  const MENU_BREAK = 1100;
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const burger = document.getElementById('hamburger-btn');

  function openDrawer() {
    sidebar.classList.add('open');
    scrim.classList.add('show');
    burger.classList.add('is-open');
    burger.setAttribute('aria-expanded', 'true');
    burger.setAttribute('aria-label', 'Close menu');
    sidebar.setAttribute('aria-hidden', 'false');
    document.body.classList.add('nav-open');
    if (ANIM) gsap.from('#nav-drawer .dock-item', { x: -16, opacity: 0, duration: .35, stagger: .025, delay: .1, clearProps: 'transform,opacity' });
  }
  function closeDrawer() {
    if (!sidebar.classList.contains('open')) return;
    sidebar.classList.remove('open');
    scrim.classList.remove('show');
    burger.classList.remove('is-open');
    burger.setAttribute('aria-expanded', 'false');
    burger.setAttribute('aria-label', 'Open menu');
    document.body.classList.remove('nav-open');
    syncDock();
  }
  function syncDock() {
    const fixed = window.innerWidth > MENU_BREAK;
    if (fixed) closeDrawer();
    sidebar.setAttribute('aria-hidden', fixed || sidebar.classList.contains('open') ? 'false' : 'true');
  }
  burger.addEventListener('click', () => sidebar.classList.contains('open') ? closeDrawer() : openDrawer());
  document.getElementById('dock-close').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);
  window.addEventListener('resize', syncDock);
  syncDock();

  /* ---- user menu ---- */
  const whoami = document.getElementById('topbar-user');
  const whoamiBtn = document.getElementById('topbar-user-btn');
  function closeWhoami() { whoami.classList.remove('open'); whoamiBtn.setAttribute('aria-expanded', 'false'); }
  whoamiBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = whoami.classList.toggle('open');
    whoamiBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', e => { if (!whoami.contains(e.target)) closeWhoami(); });

  document.getElementById('notif-btn').addEventListener('click', () => navigateTo('signoff'));
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('topbar-logout-btn').addEventListener('click', logout);

  /* ---- top bar search: searches staff; on phones the magnifier opens the field first ---- */
  const finder = document.getElementById('topbar-search');
  const finderInput = document.getElementById('topbar-search-input');
  function openFinder() { finder.classList.add('expanded'); finderInput.focus(); }
  finder.addEventListener('submit', e => {
    e.preventDefault();
    if (window.innerWidth <= 720 && !finder.classList.contains('expanded')) { openFinder(); return; }
    const q = finderInput.value.trim();
    if (!q) { finderInput.focus(); return; }
    state.staffSearch = q;
    finderInput.value = ''; finder.classList.remove('expanded'); finderInput.blur();
    navigateTo('staff');
  });
  finderInput.addEventListener('blur', () => { if (!finderInput.value.trim()) finder.classList.remove('expanded'); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDrawer(); closeWhoami(); finderInput.blur(); }
    const typing = e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); openFinder(); }
  });

  /* ---- chart tooltip ---- */
  const tip = document.getElementById('chart-tip');
  function showTip(el) {
    tip.textContent = el.getAttribute('data-tip');
    tip.classList.add('show');
    const r = el.getBoundingClientRect();
    const w = tip.offsetWidth;
    let x = r.left + r.width / 2 - w / 2;
    x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
    tip.style.left = x + 'px';
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 10) + 'px';
  }
  function hideTip() { tip.classList.remove('show'); }
  document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
  document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('focusout', hideTip);
  window.addEventListener('scroll', hideTip, { passive: true });

  /* ---- delegated clicks ---- */
  document.addEventListener('click', e => {
    const yes = e.target.closest('[data-approve]');
    if (yes) { resolveSignoff(yes.dataset.approve, true); return; }
    const no = e.target.closest('[data-decline]');
    if (no) { resolveSignoff(no.dataset.decline, false); return; }
    const navBtn = e.target.closest('[data-nav]');
    if (navBtn) { navigateTo(navBtn.getAttribute('data-nav')); return; }
    const qf = e.target.closest('.queue-filter');
    if (qf) { state.queueDept = qf.dataset.filter; renderPage(false); animateRows(); return; }
    const cf = e.target.closest('.qc-filter');
    if (cf) { state.qcSet = cf.dataset.filter; renderPage(false); animatePage(); return; }
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) { flipSwitch(toggle); return; }
  });
  document.addEventListener('keydown', e => {
    const toggle = e.target.closest && e.target.closest('[data-toggle]');
    if (toggle && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); flipSwitch(toggle); }
  });
  function flipSwitch(toggle) {
    const key = toggle.dataset.toggle;
    state.settings[key] = !state.settings[key];
    saveSettings();
    toggle.classList.toggle('on', state.settings[key]);
    toggle.setAttribute('aria-checked', String(state.settings[key]));
    if (key === 'compactRows') document.body.classList.toggle('compact', state.settings[key]);
    toast((state.settings[key] ? 'Turned on: ' : 'Turned off: ') + toggle.closest('.pref').querySelector('.pref-title').textContent, state.settings[key] ? 'yes' : 'no');
  }
  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'staff-search-input') { state.staffSearch = e.target.value; updateStaffRows(); }
  });
  document.addEventListener('change', e => {
    if (!e.target) return;
    if (e.target.id === 'lang-select')    { state.settings.language = e.target.value; saveSettings(); }
    if (e.target.id === 'timeout-select') { state.settings.sessionTimeout = e.target.value; saveSettings(); toast('Automatic sign-out set to ' + e.target.value, 'yes'); }
  });

  /* ---- boot ---- */
  paintUserChrome();
  renderPage();
  if (ANIM) {
    // the drawer's off-screen position is a CSS transform, so only animate the fixed desktop sidebar
    if (window.innerWidth > MENU_BREAK) gsap.from('.dock', { x: -30, opacity: 0, duration: .7, ease: 'power3.out', clearProps: 'transform,opacity' });
    gsap.from('.head', { y: -20, opacity: 0, duration: .6, ease: 'power3.out', clearProps: 'transform,opacity' });
  }
  </script>
</body>
</html>
